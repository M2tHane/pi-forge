<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>登录 · 小仓库进销存（原型）</title><link rel="stylesheet" href="style.css"></head>
<body class="center">
  <form class="dialog login"><h1>小仓库进销存</h1>
    <label>用户名 <input></label><label>密码 <input type="password"></label>
    <em class="err">用户名或密码不对</em>

  <p class="note">登录成功后回到登录前想打开的页面（没有就去看板）。令牌存在浏览器里，过期或退出后回到登录页。</p>
</body></html>
