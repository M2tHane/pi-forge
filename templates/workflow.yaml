version: 1
project: my-project
main_branch: main
# 流程配置：模型、角色、并发、门禁、可写范围。项目怎么装依赖、跑测试、启动服务写在 commands.yaml（architect 维护）。
limits:
  max_parallel: 3                 # 架构阶段与修复、小改动流程同时运行的 task 数
  max_parallel_backend: 3         # 同时开发的后端 domain 数（docs/plan.md 可以覆盖）；前端固定 1 个
  max_parallel_aux: 4             # 同时运行的 review、qa 数
  max_attempts: 3                 # 只计运行失败（崩溃、超时等）
  max_merge_failures: 2
  post_merge_test: true           # 每次合并后在后台跑一遍门禁命令，变红时二分定位到 task 并建修复
  port_block: 10                  # 每次运行分配的连续端口数
  lease_minutes: 45
  max_task_files: 40
  fix_max_files: 5
  change_max_tasks: 3            # /forge-change 与 forge_change 的迷你计划最多几个 task
  session_retention_days: 14
  bash_timeout_s: 300
  auto_dispatch: true
  continue_session: true          # 返工时接着原会话（fork）
  merge_batch: 3
  run_minutes: 30                 # M 号 task 的时间预算；S 减半、L 加倍；只读 task 减半
  run_grace_minutes: 5
  max_continuations: 2
review:
  max_rounds: 2                   # 第 2 轮（.rv-2）只确认；仍未解决转 blocked
testing:
  adjust_tests: true              # worker 可以修改已有测试来适配接口变化（只改不增删）
qa:
  max_rounds: 2                   # stage-qa 报告 → 修复 → 只确认
context:
  compact_at: 0.7
models:
  strong: "<provider/model>"
  medium: "<provider/model>"
  cheap:  "<provider/model>"
  # fallback: "<provider/model>"  # 兜底模型：原模型暂停（服务中断、额度用完），或换了升级模型仍同样失败时改用；也可以 /forge-config fallback 设置
escalation:
  after_failures: 2
  critical_fanout: 3              # 被大于等于 3 个 task 硬依赖：第一次就用升级模型，review 推导为 strong
# budget: { tokens: 8000000, cost: 40, warn_ratio: 0.8 }
implementation_gate:              # 所有 S 阶段共用的闸门
  all_tasks_done: true
  auto: [test, acceptance, arch_check, contract_check]   # 程序在门禁与合并后回归里跑的命令（名字在 commands.yaml 里找，没有的跳过）
  coverage: true                  # AC 覆盖率矩阵：只报告（签收时给你看），有缺口不拦门禁
  qa: true                        # stage-qa
  human: true
scopes:
  plan:       { writes: ["docs/contracts/**", "docs/arch/**", "docs/plan/**", "commands.yaml", "AGENTS.md"] }
  code:       { rules: [rules/global.md], writes: ["**"] }         # 实际范围 = task 的 writes + shared；按 layers 追加 rules/<layer>.md
  review:     { rules: [rules/global.md], writes: [] }
  qa:         { rules: [rules/global.md], writes: [] }
tool_groups:
  codegraph:   [codegraph_search, codegraph_callers, codegraph_callees, codegraph_impact, codegraph_explore,
                codegraph_node, codegraph_status, codegraph_files]
  web:         [web_search, fetch_content, get_search_content, source_check]   # pi-web-access 的搜索工具，默认不分配；要用时在角色 tools 里加 "@web"
  ask:         [ask_user]
# bash: full | readonly | allowlist 是唯一依据，写了才有 bash 工具（tools 里不写 bash）
roles:                            # notes、history、forge_block、forge_learn 所有子进程角色隐式拥有；forge_service 只给写代码的角色与 stage-qa，forge_add_dependency、forge_private_deps 只给写代码的角色
  orchestrator:        { model: strong, tools: [read, grep, find, ls, forge_read, "@ask", forge_change, forge_status, forge_wait, forge_ask_architect, forge_resolve_timeout], writes: [] }   # notes、history 隐式拥有
  architect:   { model: strong, scopes: [plan, code], bash: full, tools: [codemode, read, write, edit, forge_service, "@codegraph", forge_sync, forge_add_dependency, forge_private_deps, forge_note, forge_submit, forge_answer] }
  backend:     { model: strong, scopes: [code], bash: full, tools: [read, write, edit, forge_service, "@codegraph", forge_sync, forge_add_dependency, forge_private_deps, forge_note, forge_submit, forge_ask_architect] }   # 一个 domain 的整条后端链路
  frontend:    { model: strong, scopes: [code], bash: full, tools: [read, write, edit, forge_service, "@codegraph", forge_sync, forge_add_dependency, forge_private_deps, forge_note, forge_submit, forge_ask_architect] }   # 前端基础与全部页面，同一时间 1 个
  worker:      { model: strong, scopes: [code], bash: full, tools: [read, write, edit, forge_service, "@codegraph", forge_sync, forge_add_dependency, forge_private_deps, forge_note, forge_submit] }   # 只给修复、小改动流程
  reviewer:    { model: medium, scopes: [review], bash: allowlist, bash_allow: [typecheck, lint, test, acceptance, arch_check, contract_check], tools: [read, "@codegraph", forge_review_report, forge_review_confirm] }
  stage-qa:    { model: strong, scopes: [qa], bash: full, tools: [read, forge_service, "@codegraph", forge_qa_report, forge_qa_confirm] }
