# 运行时机制测试用；角色、scopes 与工具组对齐 v3 模板，任务 writes 决定实际可写范围。
version: 1
project: my-project
main_branch: main
commands:
  install:   "pnpm install"
  typecheck: "pnpm typecheck"
  lint:      "pnpm lint"
  test:      "pnpm test"
  e2e:       "pnpm e2e"         # 测试需要显式配置 e2e 命令，模板中该命令可选。
  acceptance: "pnpm test:acceptance"
  contract_lint: "pnpm exec redocly lint docs/contracts/openapi.yaml"
  codegen: "pnpm codegen"
generated_paths: ["web/src/api/generated/**"]
limits:
  max_parallel: 3               # 测试 helper 将并发固定为 2
  max_parallel_aux: 4
  max_attempts: 3
  max_merge_failures: 2
  post_merge_test: false           # 运行时测试默认关闭；合并后回归测试单独测
  port_block: 10
  lease_minutes: 45
  max_task_files: 12            # 测试用 13 个 writes 验证超出上限的提醒。
  fix_max_files: 5
  change_max_tasks: 3            # /forge-change 与 forge_change 的迷你计划最多几个 task
  session_retention_days: 14
  bash_timeout_s: 300
  auto_dispatch: true           # 测试 helper 关闭自动派发
  continue_session: true
  merge_batch: 3
models:
  strong: "<provider/model>"
  medium: "<provider/model>"
  cheap:  "<provider/model>"
review:
  max_rounds: 2
testing:
  adjust_tests: true
qa:
  max_rounds: 2
escalation:
  critical_fanout: 3
  after_failures: 2
implementation_gate:
  all_tasks_done: true
  auto: [typecheck, lint, test, acceptance, e2e, contract_lint, contract_test]
  coverage: true
  qa: true
  human: true
scopes:
  plan:       { writes: ["docs/contracts/**", "docs/arch/**", "docs/plan/**", "commands.yaml", "AGENTS.md"] }
  code:       { rules: [rules/global.md], writes: ["**"] }
  review:     { rules: [rules/global.md], writes: [] }
  qa:         { rules: [rules/global.md], writes: [] }
tool_groups:
  codegraph:   [codegraph_search, codegraph_callers, codegraph_callees, codegraph_impact, codegraph_explore,
                codegraph_node, codegraph_status, codegraph_files]
  web:         [web_search, fetch_content, get_search_content, source_check]
  ask:         [ask_user]
roles:
  orchestrator:              { model: strong, tools: [read, grep, find, ls, forge_read, "@ask", forge_change, forge_status, forge_wait, forge_change_request, forge_resolve_timeout], writes: [] }
  architect:         { model: strong, scopes: [plan, code], bash: full, tools: [codemode, read, write, edit, forge_service, "@codegraph", forge_sync, forge_add_dependency, forge_private_deps, forge_propose_plan, forge_note, forge_submit] }
  backend:           { model: strong, scopes: [code], bash: full, tools: [read, write, edit, "@codegraph", forge_service, forge_sync, forge_add_dependency, forge_private_deps, forge_note, forge_submit] }
  frontend:          { model: strong, scopes: [code], bash: full, tools: [read, write, edit, "@codegraph", forge_service, forge_sync, forge_add_dependency, forge_private_deps, forge_note, forge_submit] }
  worker:            { model: strong, scopes: [code], bash: full, tools: [read, write, edit, "@codegraph", forge_service, forge_sync, forge_change_request, forge_add_dependency, forge_private_deps, forge_note, forge_submit] }
  reviewer:          { model: medium, scopes: [review], bash: allowlist, bash_allow: [typecheck, lint, test, acceptance], tools: [read, "@codegraph", forge_review_report, forge_review_confirm] }
  stage-qa:          { model: strong, scopes: [qa], bash: full, tools: [read, forge_service, "@codegraph", forge_qa_report, forge_qa_confirm] }
