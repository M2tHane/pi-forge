version: 1
project: my-project
main_branch: main
commands:                         # 由 architect 在 P1 按技术栈改写（docs/rules-draft/commands.yaml），批准计划时应用
  install:         "pnpm install"
  typecheck:       "pnpm typecheck"
  lint:            "pnpm lint"
  test:            "pnpm test"                         # worker 的单元与组件测试
  acceptance:      "pnpm test:acceptance"              # 加 "-- <task>" 时只跑 tests/acceptance/<task>/；自己启停服务
  # e2e:           "pnpm test:e2e"                     # 无界面浏览器端到端，阶段门禁时运行
  contract_lint:   "pnpm exec redocly lint docs/contracts/openapi.yaml"   # 根文件引用 paths/<模块>.yaml
  # contract_test: "pnpm contract:test"                # 例如 schemathesis 对着启动的服务跑，阶段门禁时运行
  codegen:         "pnpm codegen"                      # 由 openapi.yaml 生成类型或客户端
  # serve:         "pnpm start"                        # forge_service 启动的服务；所有命令都从 PORT、FORGE_PORT_BASE、FORGE_DB_NAME、FORGE_TMP 取资源
  # merge_check:   "pnpm codegen && git diff --exit-code"   # 合并时一起跑：生成的代码与契约一致
  # db_create:     "createdb $FORGE_DB_NAME"          # 可选：服务器类数据库按 FORGE_DB_NAME 建库
  # db_drop:       "dropdb --if-exists $FORGE_DB_NAME"
  # env_up:        "docker compose up -d db"          # 可选：共享构建环境建立时运行一次（起数据库服务器等）；在环境目录里运行，$FORGE_SHARED_ENV 是它的路径
  # env_down:      "docker compose down"              # 可选：拆除共享环境时运行
  # add_dep:       "pnpm add \"$FORGE_DEP\""          # 可选：forge_add_dependency 追加依赖的命令，默认按锁文件推断（pnpm/npm/yarn/bun）
generated_paths: ["web/src/api/generated/**"]          # 由契约生成的代码
shared_env:                       # 共享构建环境：S0 结束后一次性装好依赖，之后所有 worktree 链接同一份依赖目录，不再各自 install
  # enabled: true                 # 默认开启；false 时每个 worktree 自己准备依赖
  deps: [node_modules]            # 链接进 worktree 的依赖目录；默认 node_modules
limits:
  max_parallel: 3                 # 同时运行的 impl task 数（review、qa 另计）
  max_parallel_aux: 4             # 同时运行的 review、qa 数
  max_attempts: 3                 # 只计运行失败（崩溃、超时等）
  max_precheck_failures: 3
  max_merge_failures: 2
  post_merge_test: true           # 每次合并后在后台跑一遍门禁命令，变红时二分定位到 task 并建修复
  port_block: 10                  # 每次运行分配的连续端口数
  lease_minutes: 45
  max_violations_per_run: 5
  max_task_files: 40
  fix_max_files: 5
  change_max_tasks: 3            # /forge-change 与 forge_change 的迷你计划最多几个 task
  session_retention_days: 14
  bash_timeout_s: 300
  auto_dispatch: true
  continue_session: true          # 返工时接着原会话（fork）
  merge_batch: 3
  run_minutes: 30                 # M 号 task 的时间预算；S 减半、L 加倍；只读 task 减半
  run_grace_minutes: 5
  max_continuations: 2
gui_commands: []
review:
  max_rounds: 2                   # 第 2 轮（.rv-2）只确认；仍未解决转 blocked
testing:
  adjust_tests: true              # worker 可以修改已有测试来适配接口变化（只改不增删）
qa:
  max_rounds: 2                   # stage-qa 报告 → 修复 → 只确认
context:
  compact_at: 0.7
models:
  strong: "<provider/model>"
  medium: "<provider/model>"
  cheap:  "<provider/model>"
  # fallback: "<provider/model>"  # 兜底模型：原模型暂停（服务中断、额度用完），或换了升级模型仍同样失败时改用；也可以 /forge-config fallback 设置
escalation:
  after_failures: 2
  critical_fanout: 3              # 被大于等于 3 个 task 硬依赖：第一次就用升级模型，review 推导为 strong
# budget: { tokens: 8000000, cost: 40, warn_ratio: 0.8 }
modes:
  build:
    stages:
      - { id: P0, name: spec,     phase: spec,     gate: { human: true } }
      - { id: P1, name: plan,     phase: plan,     gate: { human: true } }
      # S0…Sn 在 P1 批准时由 plan.yaml 生成，闸门见 implementation_gate
implementation_gate:              # 所有 S 阶段共用的闸门（只运行配置了的命令）
  all_tasks_done: true
  auto: [typecheck, lint, test, acceptance, e2e, contract_lint, contract_test, merge_check]
  coverage: true                  # AC 覆盖率矩阵，有缺口则失败并生成 .fx-n 让原 worker 补测试
  qa: true                        # stage-qa
  human: true
scopes:
  spec:       { writes: ["docs/spec/**"] }                         # 只经 forge_spec 由程序写入
  plan:       { writes: ["docs/contracts/**", "docs/arch/**", "docs/plan/**", "docs/spec/glossary.md", "docs/rules-draft/**", "AGENTS.md"] }
  code:       { rules: [rules/global.md], writes: ["**"] }         # 实际范围 = task 的 writes + shared；按 layers 追加 rules/<layer>.md
  review:     { rules: [rules/global.md], writes: [] }
  qa:         { rules: [rules/global.md], writes: [] }
tool_groups:
  codegraph:   [codegraph_search, codegraph_callers, codegraph_callees, codegraph_impact, codegraph_explore,
                codegraph_node, codegraph_status, codegraph_files]
  web:         [web_search, fetch_content, get_search_content, source_check]   # pi-web-access 的搜索工具，默认不分配；要用时在角色 tools 里加 "@web"
  ask:         [ask_user]
# read_paths 按 gitignore 规则从上到下匹配，后面的覆盖前面的，! 表示排除
# bash: full | readonly | allowlist 是唯一依据，写了才有 bash 工具（tools 里不写 bash）
roles:                            # notes、history、forge_block、forge_learn 所有子进程角色隐式拥有；forge_service 只给 worker、architect（S0）与 stage-qa，forge_add_dependency、forge_private_deps 给 worker 与 architect（S0）
  orchestrator:        { model: strong, tools: [read, grep, find, ls, forge_read, "@ask", forge_spec, forge_change, forge_status, forge_wait, forge_change_request, forge_resolve_timeout], read_paths: ["**"], writes: [] }   # notes、history 隐式拥有
  architect:   { model: strong, scopes: [plan, code], read_paths: ["**", "!.forge/**"], bash: full, tools: [codemode, read, write, edit, forge_service, "@codegraph", forge_sync, forge_add_dependency, forge_private_deps, forge_propose_plan, forge_note, forge_submit] }
  worker:      { model: strong, scopes: [code], read_paths: ["**", "!.forge/**"], bash: full, tools: [read, write, edit, forge_service, "@codegraph", forge_sync, forge_change_request, forge_add_dependency, forge_private_deps, forge_note, forge_submit] }
  reviewer:    { model: medium, scopes: [review], read_paths: ["**", "!.forge/**"], bash: allowlist, bash_allow: [typecheck, lint, test, acceptance], tools: [read, "@codegraph", forge_review_report, forge_review_confirm] }
  stage-qa:    { model: strong, scopes: [qa], read_paths: ["**", "!.forge/**"], bash: full, tools: [read, forge_service, "@codegraph", forge_qa_report, forge_qa_confirm] }
