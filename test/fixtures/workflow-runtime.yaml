# 来源：pi-flow test/fixtures/workflow-legacy.yaml @ 31f3f15，按 v3 模板改编
# 运行时机制测试用；保留按层角色与原 scopes/writes，S 阶段闸门取 implementation_gate。
version: 1
project: my-project
main_branch: main
commands:
  install:   "pnpm install"
  typecheck: "pnpm typecheck"
  lint:      "pnpm lint"
  test:      "pnpm test"
  e2e:       "pnpm e2e"
  acceptance: "pnpm test:acceptance"
  acceptance_list: "pnpm test:acceptance --list"
generated_paths: []
acctest_workspace:
  include: ["packages/*/package.json", "vitest.config.*", "playwright.config.*"]
  cache: [node_modules]
limits:
  max_parallel: 3               # 测试 helper 将并发固定为 2
  max_parallel_aux: 4
  max_attempts: 3
  max_precheck_failures: 3
  max_merge_failures: 2
  lean_below_loc: 6000
  port_block: 10
  lease_minutes: 45
  max_violations_per_run: 5
  max_task_files: 12
  fix_max_files: 5
  session_retention_days: 14
  bash_timeout_s: 300
  auto_dispatch: true           # 测试 helper 关闭自动派发
  continue_session: true
  merge_batch: 3
models:
  strong: "<provider/model>"
  medium: "<provider/model>"
  cheap:  "<provider/model>"
review:
  per_task: true
  max_rounds: 2
  skip_sizes: [S]
testing:
  adjust_tests: true
  max_disputes: 1
qa:
  max_rounds: 2
escalation:
  critical_fanout: 3
  after_failures: 2
modes:
  build:
    stages:
      - { id: P0, name: spec, phase: spec, gate: { human: true } }
      - { id: P1, name: plan, phase: plan, gate: { human: true } }
  feature:
    stages:
      - { id: P0, name: spec, phase: spec, gate: { human: true } }
      - { id: P1, name: plan, phase: plan, gate: { human: true } }
implementation_gate:
  all_tasks_done: true
  auto: [typecheck, lint, test, acceptance, e2e, contract_lint, contract_test, merge_check]
  coverage: true
  qa: true
  human: true
scopes:
  backend:    { rules: [rules/backend.md],      writes: ["src/server/**", "tests/server/**"] }
  database:   { rules: [rules/database.md],     writes: ["migrations/**", "src/db/**", "tests/db/**"] }
  frontend:   { rules: [rules/frontend.md],     writes: ["src/web/**", "tests/web/**"] }
  ui:         { rules: [rules/ui.md],           writes: ["design/**", "src/web/components/base/**"] }
  shared:     { rules: [rules/shared-types.md], writes: ["src/shared/**"] }
  acceptance: { rules: [rules/testing.md],      writes: ["tests/acceptance/**", "tests/e2e/**"] }
  docs:       { rules: [rules/docs.md],         writes: ["docs/**"] }
  research:   { writes: ["docs/research/**"] }
  code:       { writes: ["**"] }
  checking:   { writes: [] }
  acctest:    { writes: ["tests/acceptance/**"] }
  infra:      { writes: ["package.json", "pnpm-lock.yaml", "tsconfig*.json", ".github/**"] }
tool_groups:
  serena_read: [serena_get_symbols_overview, serena_find_symbol, serena_find_referencing_symbols, serena_search_for_pattern,
                serena_find_declaration, serena_find_implementations, serena_get_diagnostics_for_file]
  serena_edit: [serena_replace_symbol_body, serena_insert_before_symbol, serena_insert_after_symbol,
                serena_safe_delete_symbol, serena_replace_content]
  codegraph:   [codegraph_search, codegraph_callers, codegraph_callees, codegraph_impact, codegraph_explore,
                codegraph_node, codegraph_status, codegraph_files]
  web:         [web_search, fetch_content, get_search_content, source_check]
  ask:         [ask_user]
roles:
  orchestrator:              { model: medium, tools: [read, grep, find, ls, forge_read, "@ask", forge_spec, forge_spec_amend, forge_status, forge_wait, forge_change_request, forge_resolve_timeout, forge_resolve_scope], read_paths: ["**"], writes: [] }
  architect:         { model: strong, scopes: [docs, shared], bash: readonly, tools: [codemode, read, write, edit, "@serena_read", "@codegraph", forge_propose_plan, forge_note, forge_submit] }
  worker:            { model: strong, scopes: [code], read_paths: ["**", "!.forge/**"], bash: full, tools: [read, write, edit, "@serena_read", "@serena_edit", "@codegraph", forge_service, forge_sync, forge_dispute, forge_change_request, forge_request_scope, forge_note, forge_submit] }
  test-author:       { model: medium, scopes: [acctest], bash: allowlist, bash_allow: [acceptance_list, acceptance], tools: [read, write, edit, forge_note, forge_submit] }
  reviewer:          { model: medium, scopes: [checking], read_paths: ["**", "!.forge/**"], bash: readonly, tools: [read, "@serena_read", "@codegraph", forge_review_report, forge_review_confirm] }
  stage-qa:          { model: strong, scopes: [checking], read_paths: ["**", "!.forge/**"], bash: full, tools: [read, forge_service, "@serena_read", "@codegraph", forge_qa_report, forge_qa_confirm] }
  researcher:        { model: cheap,  scopes: [research], tools: [read, write, "@web", forge_note, forge_submit] }
  db-engineer:       { model: medium, scopes: [database], bash: full, tools: [read, write, edit, "@serena_read", "@serena_edit", forge_request_scope, forge_service, forge_claim, forge_note, forge_submit] }
  backend-engineer:  { model: medium, scopes: [backend],  bash: full, tools: [read, write, edit, "@serena_read", "@serena_edit", forge_request_scope, forge_service, forge_claim, forge_note, forge_submit] }
  frontend-engineer: { model: medium, scopes: [frontend], bash: full, tools: [read, write, edit, "@serena_read", "@serena_edit", forge_request_scope, forge_service, forge_claim, forge_note, forge_submit] }
  ui-designer:       { model: medium, scopes: [ui],       tools: [read, write, edit, forge_claim, forge_note, forge_submit] }
  infra-engineer:    { model: medium, scopes: [infra],    bash: full, tools: [read, write, edit, forge_request_scope, forge_service, forge_claim, forge_note, forge_submit] }
  test-engineer:     { model: medium, scopes: [acceptance], bash: full, tools: [read, write, edit, "@serena_read", "@codegraph", forge_request_scope, forge_service, forge_claim, forge_note, forge_submit] }
