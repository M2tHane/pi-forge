# 改编自 pi-flow test/fixtures/workflow-legacy.yaml @ 31f3f15（M2 按 pi-forge 角色重写）
# 运行时机制测试用；角色、scopes 与工具组对齐 v3 模板，任务 writes 决定实际可写范围。
version: 1
project: my-project
main_branch: main
commands:
  install:   "pnpm install"
  typecheck: "pnpm typecheck"
  lint:      "pnpm lint"
  test:      "pnpm test"
  e2e:       "pnpm e2e"         # 测试需要显式配置 e2e 命令，模板中该命令可选。
  acceptance: "pnpm test:acceptance"
  acceptance_list: "pnpm test:acceptance --list"
  contract_lint: "pnpm exec redocly lint docs/contracts/openapi.yaml"
  codegen: "pnpm codegen"
generated_paths: ["web/src/api/generated/**"]
acctest_workspace:
  include: ["packages/*/package.json", "vitest.config.*", "playwright.config.*"]
  cache: [node_modules]
limits:
  max_parallel: 3               # 测试 helper 将并发固定为 2
  max_parallel_aux: 4
  max_attempts: 3
  max_precheck_failures: 3
  max_merge_failures: 2
  lean_below_loc: 6000
  port_block: 10
  lease_minutes: 45
  max_violations_per_run: 5
  max_task_files: 12            # 测试用 13 个 writes 验证超出上限的提醒。
  fix_max_files: 5
  session_retention_days: 14
  bash_timeout_s: 300
  auto_dispatch: true           # 测试 helper 关闭自动派发
  continue_session: true
  merge_batch: 3
models:
  strong: "<provider/model>"
  medium: "<provider/model>"
  cheap:  "<provider/model>"
review:
  per_task: true
  max_rounds: 2
  skip_sizes: [S]
testing:
  adjust_tests: true
  max_disputes: 1
qa:
  max_rounds: 2
escalation:
  critical_fanout: 3
  after_failures: 2
modes:
  build:
    stages:
      - { id: P0, name: spec, phase: spec, gate: { human: true } }
      - { id: P1, name: plan, phase: plan, gate: { human: true } }
  feature:
    stages:
      - { id: P0, name: spec, phase: spec, gate: { human: true } }
      - { id: P1, name: plan, phase: plan, gate: { human: true } }
implementation_gate:
  all_tasks_done: true
  auto: [typecheck, lint, test, acceptance, e2e, contract_lint, contract_test, merge_check]
  coverage: true
  qa: true
  test_author: true               # 运行时夹具显式开启 test-author（模板默认关闭，偏离 118），沿用 acctest 相关用例
  human: true
scopes:
  spec:       { writes: ["docs/spec/**"] }
  plan:       { writes: ["docs/contracts/**", "docs/arch/**", "docs/plan/**", "docs/spec/glossary.md", "docs/rules-draft/**", "AGENTS.md"] }
  code:       { rules: [rules/global.md], writes: ["**"] }
  acctest:    { rules: [rules/global.md], writes: ["tests/acceptance/**"] }
  review:     { rules: [rules/global.md], writes: [] }
  qa:         { rules: [rules/global.md], writes: [] }
  research:   { writes: ["docs/research/**"] }
tool_groups:
  serena_read: [serena_get_symbols_overview, serena_find_symbol, serena_find_referencing_symbols, serena_search_for_pattern,
                serena_find_declaration, serena_find_implementations, serena_get_diagnostics_for_file]
  serena_edit: [serena_replace_symbol_body, serena_insert_before_symbol, serena_insert_after_symbol,
                serena_safe_delete_symbol, serena_replace_content]
  codegraph:   [codegraph_search, codegraph_callers, codegraph_callees, codegraph_impact, codegraph_explore,
                codegraph_node, codegraph_status, codegraph_files]
  web:         [web_search, fetch_content, get_search_content, source_check]
  ask:         [ask_user]
roles:
  orchestrator:              { model: strong, tools: [read, grep, find, ls, forge_read, "@ask", forge_spec, forge_spec_amend, forge_status, forge_wait, forge_change_request, forge_resolve_timeout, forge_resolve_scope], read_paths: ["**"], writes: [] }
  architect:         { model: strong, scopes: [plan], read_paths: ["**", "!.forge/**"], bash: readonly, tools: [codemode, read, write, edit, "@serena_read", "@codegraph", forge_propose_plan, forge_note, forge_submit] }
  worker:            { model: strong, scopes: [code], read_paths: ["**", "!.forge/**"], bash: full, tools: [read, write, edit, "@serena_read", "@serena_edit", "@codegraph", forge_service, forge_sync, forge_dispute, forge_change_request, forge_request_scope, forge_add_dependency, forge_private_deps, forge_note, forge_submit] }
  test-author:       { model: medium, scopes: [acctest], bash: allowlist, bash_allow: [acceptance_list, acceptance], tools: [read, write, edit, forge_note, forge_submit] }
  reviewer:          { model: medium, scopes: [review], read_paths: ["**", "!.forge/**"], bash: allowlist, bash_allow: [test, acceptance], tools: [read, "@serena_read", "@codegraph", forge_review_report, forge_review_confirm] }
  stage-qa:          { model: strong, scopes: [qa], read_paths: ["**", "!.forge/**"], bash: full, tools: [read, forge_service, "@serena_read", "@codegraph", forge_qa_report, forge_qa_confirm] }
  researcher:        { model: medium, scopes: [research], read_paths: ["**", "!.forge/**"], tools: [read, write, "@web", forge_note, forge_submit] }
